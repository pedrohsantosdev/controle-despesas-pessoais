name: CI - Build e testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar e testar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Permitir a execucao do Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar e executar os testes
        run: ./mvnw --batch-mode --no-transfer-progress verify
